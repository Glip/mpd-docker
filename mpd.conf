music_directory     "/var/lib/mpd/music"
playlist_directory   "/var/lib/mpd/playlists"
db_file              "/var/lib/mpd/tag_cache"
state_file           "/var/lib/mpd/state"
sticker_file         "/var/lib/mpd/sticker.sql"
pid_file             "/run/mpd/pid"

user                 "mpd"
bind_to_address      "0.0.0.0"
port                 "6600"
log_level            "notice"
auto_update          "yes"
filesystem_charset   "UTF-8"

input {
    plugin "curl"
}

# Local sound is available when /dev/snd is passed into the container.
audio_output {
    type        "alsa"
    name        "ALSA"
    enabled     "no"
}

# Opens while something is playing, then stays open.
audio_output {
    type            "httpd"
    name            "HTTP Stream"
    encoder         "vorbis"
    port            "8000"
    bind_to_address "0.0.0.0"
    quality         "5.0"
    format          "44100:16:2"
    always_on       "yes"
}